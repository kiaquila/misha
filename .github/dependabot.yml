# Weekly dependency updates.
#
# Minor and patch updates arrive as one grouped pull request per ecosystem;
# major updates stay separate so each is reviewed on its own. The cooldown
# holds a freshly published version out of the repository for a few days.
#
# This file only schedules routine version updates. Dependabot alerts and
# security updates are repository settings and are enabled there.
version: 2
updates:
  # The website's own toolchain.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      website-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The repository check's YAML parser.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      harness-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The workflow is this repository's own file, so an action-pin bump is a
  # normal reviewable pull request here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Action tags are not guaranteed to be semantic versions, so only the
    # default cooldown applies to this ecosystem.
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
